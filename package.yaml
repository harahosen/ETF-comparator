name: etf-comparator
version: 0.1.0.0
# license:
# author:
# maintainer:
description: ETF composition comparison tool


default-extensions:
  - OverloadedStrings
  - DeriveGeneric
  - RecordWildCards

dependencies:
  - base >= 4.14 && < 5
  - containers
  - text
  - bytestring
  - vector
  - cassava
  - filepath
  - directory
  - mtl
  - yaml
  - time
  - aeson

library:
  source-dirs: src

tests:
  etf-comparator-test:
    main: Spec.hs
    source-dirs: test
    dependencies:
      - etf-comparator
      - hspec
    other-modules:
      - DemoComparison
      - Domain.ComparisonSpec
      - Domain.MergeSpec
      - Domain.NormalizationSpec
      - Domain.ValidationSpec
      - Ingestion.FileLoaderSpec
      - Ingestion.FileMetaSpec
      - Ingestion.MappingLoaderSpec
      - Ingestion.ResolveAssetIdSpec
      - Parser.CustomSpec
      - Parser.ISharesSpec
      - Parser.StateStreetSpec
      - Service.OutputWriterSpec
      - Service.PipelineSpec